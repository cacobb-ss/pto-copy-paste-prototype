<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PTO Copy/Paste — Interactive Prototype</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
  <!-- ===== Top Header Bar ===== -->
  <header class="topbar">
    <div class="topbar-left">
      <i class="fa-solid fa-cube app-logo"></i>
      <span class="job-name">BDT House</span>
      <span class="job-dots">•••</span>
    </div>
    <div class="topbar-center">
      <button class="tool-btn active">Dimension Tool <i class="fa-solid fa-caret-down"></i></button>
      <button class="tool-btn">Joist/Rafter Tool</button>
      <button class="tool-btn">Beam/Header Tool</button>
      <button class="tool-btn">Annotations <i class="fa-solid fa-caret-down"></i></button>
    </div>
    <div class="topbar-right">
      <div class="clipboard-indicator" id="clipboard-indicator" title="Items on clipboard">
        <i class="fa-solid fa-clipboard"></i>
        <span>Clipboard</span>
        <span class="clip-count" id="clip-count">0</span>
      </div>
      <span class="sync-badge"><i class="fa-solid fa-circle-check"></i> Quantities Synced</span>
      <div class="profile-circle"></div>
    </div>
  </header>

  <div class="main-layout">
    <!-- ===== Left Sheets Panel ===== -->
    <aside class="sheets-panel" id="sheets-panel">
      <div class="panel-header">
        <span><i class="fa-regular fa-clone"></i> Sheets</span>
        <span class="collapse-toggle" id="sheets-collapse" title="Collapse panel"><i class="fa-solid fa-angles-left"></i></span>
      </div>
      <div class="panel-body">
        <div class="search-box">
          <i class="fa-solid fa-search"></i>
          <input type="text" id="sheet-search" placeholder="Search sheets..." />
        </div>
        <ul class="sheet-list" id="sheet-list"><!-- populated by JS --></ul>
      </div>
    </aside>

    <!-- ===== Center Canvas ===== -->
    <main class="canvas-area">
      <div class="canvas-content">
        <div class="canvas-sheet">
          <span class="sheet-corner" id="canvas-corner">Sheet</span>
          <i class="fa-solid fa-compass-drafting sheet-watermark"></i>
          <div class="sheet-title" id="canvas-title"></div>
        </div>
      </div>
      <div class="status-bar">
        <span class="status-item">Scale: <b>1/4" = 1'0"</b></span>
        <span class="status-item">Tool: <b>No Tool Selected</b></span>
        <span class="status-spacer"></span>
        <span class="status-item">Toolbar <b class="on">ON</b></span>
        <span class="status-item">Snap <b class="on">ON</b></span>
        <span class="status-item">Ortho <b class="on">ON</b></span>
      </div>
    </main>

    <!-- ===== Right Takeoff Panel ===== -->
    <aside class="takeoff-panel">
      <div class="panel-top-row">
        <div class="tab-bar">
          <button class="tab active" id="tab-takeoff">Takeoff</button>
          <button class="tab" id="tab-sections">Sections</button>
        </div>
        <span class="panel-dots">•••</span>
      </div>
      <div class="search-box">
        <i class="fa-solid fa-search"></i>
        <input type="text" id="tree-search" placeholder="Search takeoff items..." />
      </div>
      <div class="takeoff-tree" id="takeoff-tree"><!-- populated by JS --></div>
    </aside>
  </div>

  <!-- ===== Right-click Context Menu ===== -->
  <div class="context-menu" id="context-menu">
    <div class="ctx-item" id="ctx-copy">
      <i class="fa-solid fa-copy ctx-icon"></i>
      <span class="ctx-label">Copy</span>
      <span class="ctx-shortcut">Ctrl+C</span>
    </div>
    <div class="ctx-item" id="ctx-paste">
      <i class="fa-solid fa-paste ctx-icon"></i>
      <span class="ctx-label">Paste</span>
      <span class="ctx-shortcut">Ctrl+V</span>
    </div>
    <div class="ctx-divider"></div>
    <div class="ctx-item danger" id="ctx-delete">
      <i class="fa-solid fa-trash ctx-icon"></i>
      <span class="ctx-label">Delete</span>
      <span class="ctx-shortcut">Del</span>
    </div>
  </div>

  <!-- ===== Toast container ===== -->
  <div class="toast-container" id="toast-container"></div>

  <!-- ===== Help pill ===== -->
  <div class="help-pill">
    <b>Click</b> select &middot; <b>Ctrl+Click</b> toggle &middot; <b>Shift+Click</b> range &middot;
    <b>Ctrl+C/V</b> copy/paste &middot; <b>Del</b> delete &middot; <b>Dbl-click</b> edit &middot; <b>Right-click</b> menu
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
